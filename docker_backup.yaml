version: '3.8'

services:
  # ═══════════════════════════════════════════════════════
  # MongoDB Database - Must start first and be healthy
  # ═══════════════════════════════════════════════════════
  mongodb:
    image: mongo:5.0
    container_name: disaster-mongodb
    restart: unless-stopped
    
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: DisasterRelief2024!
      MONGO_INITDB_DATABASE: rocketchat
    
    networks:
      - disaster_network
    
    # IMPROVED: More reliable health check
    healthcheck:
      test: |
        mongosh --eval "db.adminCommand('ping')" --quiet || exit 1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s  # Give MongoDB 40 seconds before starting health checks

  # ═══════════════════════════════════════════════════════
  # Rocket.Chat Application - Waits for healthy MongoDB
  # ═══════════════════════════════════════════════════════
  rocketchat:
    image: rocket.chat:6.3
    container_name: disaster-rocketchat
    restart: unless-stopped
    
    # CRITICAL: Wait for MongoDB to be healthy
    depends_on:
      mongodb:
        condition: service_healthy
    
    ports:
      - "3000:3000"
    
    environment:
      # Connection string with proper authentication
      MONGO_URL: mongodb://admin:DisasterRelief2024!@mongodb:27017/rocketchat?authSource=admin
      MONGO_OPLOG_URL: mongodb://admin:DisasterRelief2024!@mongodb:27017/local?authSource=admin
      
      # Application settings
      ROOT_URL: http://10.66.63.151:3000
      PORT: 3000
      
      # Performance optimizations
      Accounts_UseDNSDomainCheck: "false"
      
      # Allow user registration
      OVERWRITE_SETTING_Accounts_RegistrationForm: "Public"
      
      # Optional: Pre-create admin (uncomment if needed)
      # ADMIN_USERNAME: admin
      # ADMIN_PASS: DisasterRelief2024!
      # ADMIN_EMAIL: admin@disaster-relief.local
    
    volumes:
      - rocketchat_uploads:/app/uploads
    
    networks:
      - disaster_network
    
    # IMPROVED: More patient health check
    healthcheck:
      test: |
        curl --fail http://localhost:3000/api/info || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s  # Give Rocket.Chat 90 seconds before checking

networks:
  disaster_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  rocketchat_uploads:
    driver: local
