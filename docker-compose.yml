version: '3.8'

services:
  # ═══════════════════════════════════════════════════════
  # MongoDB (Mode Trusted - Base de données pour RocketChat)
  # ═══════════════════════════════════════════════════════
  mongodb:
    image: mongo:5.0
    container_name: disaster-mongodb
    restart: unless-stopped
    command: mongod --oplogSize 128 --replSet rs0 --bind_ip_all
    volumes:
      - ./data/db:/data/db
      - ./data/configdb:/data/configdb
    networks:
      - disaster_network

  mongo-init-replica:
    image: mongo:5.0
    command: >
      bash -c "for i in `seq 1 30`; do
        mongosh mongodb://mongodb:27017/ --eval 'rs.initiate({ _id: \"rs0\", members: [ { _id: 0, host: \"mongodb:27017\" } ] })' &&
        s=$$? && break || s=$$?;
        echo 'Waiting for mongo...';
        sleep 5;
      done; (exit $$s)"
    depends_on:
      - mongodb
    networks:
      - disaster_network

  # ═══════════════════════════════════════════════════════
  # Rocket.Chat (Le Hub de communication)
  # ═══════════════════════════════════════════════════════
  rocketchat:
    image: rocket.chat:6.12.0
    container_name: disaster-rocketchat
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://mongodb:27017/rocketchat
      MONGO_OPLOG_URL: mongodb://mongodb:27017/local?replicaSet=rs0
      ROOT_URL: http://localhost:3000
      PORT: 3000
      Accounts_UseDNSDomainCheck: "false"
      OVERWRITE_SETTING_Accounts_RegistrationForm: "Public"
    volumes:
      - rocketchat_uploads:/app/uploads
    networks:
      - disaster_network
    depends_on:
      - mongodb
      - mongo-init-replica

  # ═══════════════════════════════════════════════════════
  # Moteur IA Local (Ollama)
  # ═══════════════════════════════════════════════════════
  ai-engine:
    image: ollama/ollama
    container_name: disaster-ai-hub
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    networks:
      - disaster_network
    # Décommentez la section ci-dessous si vous lancez ceci sur votre PC fixe avec la carte AMD (ROCm)
    # devices:
    #   - "/dev/kfd:/dev/kfd"
    #   - "/dev/dri:/dev/dri"
    #
    # Décommentez la section ci-dessous si vous lancez ceci sur le PC avec la carte NVIDIA (CUDA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  disaster_network:
    driver: bridge

volumes:
  rocketchat_uploads:
    driver: local
