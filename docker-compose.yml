version: "3.8"

services:
  mongodb:
    image: mongo:6.0
    container_name: resqnet-mongodb
    restart: unless-stopped
    command: mongod --replSet rs0 --oplogSize 128
    volumes:
      - mongodb_data:/data/db
    networks:
      - resqnet

  mongo-init-replica:
    image: mongo:6.0
    container_name: resqnet-mongo-init
    restart: on-failure
    depends_on:
      - mongodb
    command: >
      mongosh --host mongodb:27017 --eval
      "try { rs.status() } catch(e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }) }"
    networks:
      - resqnet

  rocketchat:
    image: rocket.chat:6.3
    container_name: resqnet-rocketchat
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      MONGO_URL: mongodb://mongodb:27017/rocketchat?replicaSet=rs0
      MONGO_OPLOG_URL: mongodb://mongodb:27017/local?replicaSet=rs0
      ROOT_URL: http://localhost:3000
      PORT: 3000
      DEPLOY_PLATFORM: docker
    ports:
      - "3000:3000"
    networks:
      - resqnet

  resqbot:
    build: ./resqbot
    container_name: resqnet-resqbot
    restart: unless-stopped
    environment:
      # URL Ollama sur la machine hôte (pas dans Docker)
      OLLAMA_URL: http://172.17.0.1:11434/api/generate
      OLLAMA_MODEL: phi3:mini
      ROCKETCHAT_URL: http://rocketchat:3000
    extra_hosts:
      - "host-gateway:host-gateway"
    ports:
      - "5000:5000"
    networks:
      - resqnet

networks:
  resqnet:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
